name: Windows memory probe

# Temporary: native Windows runs for the windows-memory-suites branch while
# the memory suites are ported. Removed before the branch is merged.
on:
  push:
    branches: [windows-memory-suites]
  workflow_dispatch:

jobs:
  facts:
    name: "Windows facts (Python ${{ matrix.python }})"
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Platform facts the memory suites depend on
        shell: pwsh
        run: python .github/windows-probe/probe.py

  suites:
    name: "Memory suites (${{ matrix.shard }})"
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cursor
            suites: >-
              tests.test_cursor_continuation_state tests.test_cursor_continuation tests.test_cursor_generator_contract
              tests.test_cursor_root_rename tests.test_cursor_review_recovery tests.test_memory_generator_identity
              tests.test_memory_generator_boundary
          - shard: hooks
            suites: >-
              tests.test_memory_startup_readonly tests.test_memory_inferred_identity tests.test_memory_git_source_scope
          - shard: results
            suites: >-
              tests.test_memory_source_resilience tests.test_memory_review_regressions tests.test_memory_review_privacy
              tests.test_memory_review_harness tests.test_memory_result_fencing tests.test_memory_result_evidence
              tests.test_memory_native_roundtrip
          - shard: sources
            suites: >-
              tests.test_memory_cached_ignore_boundaries tests.test_memory_retained_citations tests.test_memory_authority_utf8
              tests.test_memory_secret_policy_delivery tests.test_memory_brain_scale tests.test_memory_quoted_image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Each suite in its own process
        shell: pwsh
        run: |
          $failed = @()
          foreach ($suite in "${{ matrix.suites }}".Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)) {
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            python -m unittest -v $suite
            $code = $LASTEXITCODE
            Write-Output ("RESULT {0} exit={1} seconds={2:N1}" -f $suite, $code, $watch.Elapsed.TotalSeconds)
            if ($code -ne 0) { $failed += $suite }
          }
          if ($failed.Count) { Write-Output ("FAILED: " + ($failed -join " ")); exit 1 }
