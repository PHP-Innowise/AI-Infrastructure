name: Windows memory probe

# Temporary: native Windows runs for the windows-memory-suites branch while
# the memory suites are ported. Removed before the branch is merged.
on:
  push:
    branches: [windows-memory-suites]
  workflow_dispatch:

jobs:
  facts:
    name: "Windows facts (Python ${{ matrix.python }})"
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Platform facts the memory suites depend on
        shell: pwsh
        run: python .github/windows-probe/probe.py

  suites:
    name: "Memory suites (${{ matrix.shard }})"
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cursor
            suites: >-
              tests.test_cursor_continuation_state tests.test_cursor_continuation tests.test_cursor_generator_contract
              tests.test_cursor_root_rename tests.test_cursor_review_recovery tests.test_memory_generator_identity
              tests.test_memory_generator_boundary
          - shard: hooks
            suites: >-
              tests.test_memory_startup_readonly tests.test_memory_inferred_identity tests.test_memory_git_source_scope
          - shard: results
            suites: >-
              tests.test_memory_source_resilience tests.test_memory_review_regressions tests.test_memory_review_privacy
              tests.test_memory_review_harness tests.test_memory_result_fencing tests.test_memory_result_evidence
              tests.test_memory_native_roundtrip
          - shard: sources
            suites: >-
              tests.test_memory_cached_ignore_boundaries tests.test_memory_retained_citations tests.test_memory_authority_utf8
              tests.test_memory_secret_policy_delivery tests.test_memory_brain_scale tests.test_memory_quoted_image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Each suite in its own process
        shell: pwsh
        run: |
          $failed = @()
          foreach ($suite in "${{ matrix.suites }}".Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)) {
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            python -m unittest -v $suite
            $code = $LASTEXITCODE
            Write-Output ("RESULT {0} exit={1} seconds={2:N1}" -f $suite, $code, $watch.Elapsed.TotalSeconds)
            if ($code -ne 0) { $failed += $suite }
          }
          if ($failed.Count) { Write-Output ("FAILED: " + ($failed -join " ")); exit 1 }

  harness-job:
    name: "windows-harness with the ported suites (one process)"
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: All Windows modules in one process, as windows-harness runs them
        shell: pwsh
        run: >-
          python -m unittest
          tests.test_harness_windows tests.test_harness_launcher tests.test_harness_process_runtime
          tests.test_harness_merge_archive tests.test_portable_fs tests.test_windows_security tests.test_windows_commands
          tests.test_windows_creator tests.test_windows_discovery tests.test_windows_memory_hooks
          tests.test_cursor_portable_custody tests.test_cursor_continuation tests.test_cursor_continuation_state
          tests.test_memory_source_resilience tests.test_memory_startup_readonly tests.test_memory_optional_publication
          tests.test_memory_retained_citations tests.test_memory_mask_prefilter tests.test_memory_credential_prefix
          tests.test_memory_config_observation tests.test_memory_git_source_scope tests.test_memory_inferred_identity
          tests.test_memory_portable_output tests.test_memory_generator_identity tests.test_memory_generator_boundary
          tests.test_memory_generator_continuation tests.test_memory_cached_ignore tests.test_memory_cached_ignore_boundaries
          tests.test_memory_final_source_image tests.test_memory_final_task_fifo tests.test_memory_final_reader_abort
          tests.test_memory_temporal_delivery tests.test_memory_secret_policy_delivery tests.test_memory_quoted_image
          tests.test_memory_rendered_image tests.test_memory_utf8_sources tests.test_memory_policy_utf8
          tests.test_memory_authority_utf8 tests.test_memory_cursor_report tests.test_memory_native_roundtrip
          tests.test_memory_native_capture tests.test_memory_health_notices tests.test_memory_cost_replay
          tests.test_memory_prompt_generator tests.test_hindsight_openapi_declaration tests.test_cursor_root_rename
          tests.test_memory_result_fencing tests.test_memory_result_evidence tests.test_memory_brain_scale
          tests.test_memory_orphaned_task tests.test_memory_review_regressions tests.test_memory_review_privacy
          tests.test_memory_review_harness tests.test_cursor_review_recovery tests.test_cursor_generator_contract
          tests.test_longmemeval_compile_portability tests.test_ai_system_portable tests.test_desktop_app
