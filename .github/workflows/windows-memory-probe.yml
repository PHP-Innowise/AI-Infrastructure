name: Windows memory probe

# Temporary: native Windows runs for the windows-memory-suites branch while
# the memory suites are ported. Removed before the branch is merged.
on:
  push:
    branches: [windows-memory-suites]
  workflow_dispatch:

jobs:
  facts:
    name: "Windows facts (Python ${{ matrix.python }})"
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Platform facts the memory suites depend on
        shell: pwsh
        run: python .github/windows-probe/probe.py
      - name: Promotion failures with full diffs
        if: matrix.python == '3.13'
        continue-on-error: true
        shell: pwsh
        run: python .github/windows-probe/maxdiff.py tests.test_memory_native_roundtrip tests.test_memory_review_harness

