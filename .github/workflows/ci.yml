name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  system-orchestration:
    name: "system orchestration (Python ${{ matrix.python }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test universal system planning and execution
        run: |
          sudo apt-get update -qq && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 runners block unprivileged user namespaces through AppArmor,
          # which the AI discovery sandbox (bubblewrap) needs.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-pid --ro-bind / / --proc /proc --dev /dev true
          python3 -m unittest tests.test_ai_system tests.test_ai_system_providers tests.test_ai_system_execution tests.test_ai_system_portable tests.test_harness_system_orchestration tests.test_harness_system_editor tests.test_harness_system_discovery tests.test_harness_agent_activity
      - name: Validate synthetic service catalog
        run: python3 scripts/ai_system.py validate --system docs/examples/ai-system/system.json

  tests:
    name: "tests (${{ matrix.suite }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - "Laravel/memory-bank/tests"
          - "Laravel/project-brain/tests"
          - "Symfony/memory-bank/tests"
          - "Symfony/project-brain/tests"
          - "PHP Core/memory-bank/tests"
          - "PHP Core/project-brain/tests"
          - "Cms/wordpress/memory-bank/tests"
          - "Cms/wordpress/project-brain/tests"
          - "Infrastructure-Creator/tests"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run unit tests
        working-directory: ${{ matrix.suite }}
        run: |
          for test_file in test_*.py; do
            python3 "$test_file"
          done

  qa-tooling:
    name: qa-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-qa.txt
      - name: Install pinned workbook and schema dependencies
        run: |
          python3 -m venv scripts/qa/.venv
          scripts/qa/.venv/bin/python -m pip install -r requirements-qa.txt
      - name: Test QA artifact tooling
        run: scripts/qa/.venv/bin/python -m unittest discover -s scripts/qa/tests
      - name: Validate QA schemas and case catalog
        run: scripts/qa/.venv/bin/python scripts/qa/validate_qa_artifacts.py --skip-run-evidence

  parity:
    name: "parity (${{ matrix.edition }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        edition:
          - "Laravel"
          - "Symfony"
          - "PHP Core"
          - "Cms/wordpress"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Mirror parity
        working-directory: ${{ matrix.edition }}
        run: python3 memory-bank/scripts/context.py parity
      - name: Cross-edition core parity
        working-directory: ${{ matrix.edition }}
        run: python3 memory-bank/scripts/context.py parity --cross-edition
      # The generator asset is the fourth copy of the memory core and the one
      # the cross-edition walk above cannot see, so an engine fix can land in
      # all three editions, leave CI green, and still miss every project the
      # generator builds. Repository-scoped, hence run once rather than per
      # matrix leg; the guard keeps it inside the job it belongs to.
      - name: Generator-asset parity
        if: matrix.edition == 'Laravel'
        run: python3 scripts/asset_parity.py --check
      - name: Generator-asset parity regression tests
        if: matrix.edition == 'Laravel'
        run: python3 -m unittest tests.test_asset_parity

  mirrors:
    name: mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify tool mirrors against canon
        run: python3 scripts/build_mirrors.py --check
      - name: Mirror executor regression tests
        run: python3 -m unittest tests.test_build_mirrors
      # Hooks run as direct commands; a script that lost its executable bit in
      # the index exits 126 in every installed project.
      - name: Executable bits recorded in the Git index
        run: python3 -m unittest tests.test_file_modes
      # Every shipped bash-validator copy (4 editions + Infrastructure-Creator,
      # all three tool trees) against the shared block/pass corpus.
      - name: Bash validator corpus
        run: python3 -m unittest tests.test_bash_validator_corpus
      # Mirrors prove the copies agree with canon; this proves canon points at
      # things that exist: every wired hook script is tracked as 100755, every
      # command/agent/flow/AGENTS.md reference resolves in its own tool, and
      # every skill is reachable or allowlisted with a reason.
      - name: Wiring and routing references resolve
        run: |
          python3 scripts/check_routes.py
          python3 -m unittest tests.test_check_routes

  infrastructure-creator-reliability:
    # Pinned to the 3.9 floor on purpose: a 3.x leg would only repeat the
    # tests matrix (the "Infrastructure-Creator/tests" suite already runs
    # on 3.x above) and the mirrors job (--check covers every edition).
    # What this job adds is the 3.9 run itself plus the reference-catalog
    # and edition-scoped mirror gates.
    name: "Infrastructure-Creator reliability (Python 3.9)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Run complete reliability suite
        run: python3 -m unittest discover -s Infrastructure-Creator/tests -p "test_*.py"
      - name: Validate canonical reference contracts
        run: >-
          python3
          Infrastructure-Creator/.agents/skills/bootstrap-verifier/scripts/validate_reference_catalogs.py
          --references-dir
          Infrastructure-Creator/.agents/skills/skill-forge/references
      - name: Verify Infrastructure-Creator mirrors
        run: python3 scripts/build_mirrors.py --check --edition Infrastructure-Creator

  installation:
    name: installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify deterministic installation inventories
        run: python3 scripts/install_accelerator.py --verify-inventories
      - name: Test selected-tool clean installations
        run: python3 -m unittest tests.test_installation
      - name: Preserve framework-specific skill semantics
        run: python3 -m unittest tests.test_framework_semantics
      - name: Hook wiring runs from any working directory
        # A bare relative hook path exits 127 from a subdirectory, which
        # Claude Code and Codex treat as non-blocking: the guard fails open.
        run: python3 -m unittest tests.test_hook_wiring
      - name: Attach an edition without copying it
        run: python3 -m unittest tests.test_accelerator_attach
      - name: Memory evaluation stand
        # The stand runs on client prompts and stays out of CI; its as-of
        # reconstruction, edition overlay, scoring, report and transcript
        # parsing run here on a synthetic project, with one real refresh.
        run: python3 -m unittest tests.test_memory_eval tests.test_memory_graph_pilot
      - name: Optional developer tooling stays out of the editions
        # The live code2prompt checks skip themselves here (no Rust toolchain);
        # what runs is the containment contract and the argv/exclude pins.
        run: python3 -m unittest tests.test_collect_context
      - name: Kit 3 admission registry is well-formed
        # Recomputes every verdict from its gates: a forged `clear` over a
        # failing binary gate fails here rather than reaching a client project.
        run: python3 scripts/validate_registry.py --check
      - name: Kit 3 registry and catalog regression tests
        run: python3 -m unittest tests.test_registry tests.test_open_source_kit tests.test_kit_fetcher tests.test_kit3 tests.test_kit3_catalog
      - name: Native browser harness regression tests
        run: python3 -m unittest tests.test_harness_providers tests.test_harness_run_activity tests.test_harness_commands tests.test_harness_sessions tests.test_harness_web tests.test_harness_merge tests.test_harness_process_guard tests.test_harness_process_runtime tests.test_harness_launcher tests.test_harness_skills tests.test_harness_fleet tests.test_harness_knowledge tests.test_harness_memory_use tests.test_harness_context_usage tests.test_harness_task_context tests.test_harness_memory_draft tests.test_memory_mcp tests.test_mcp_registration tests.test_harness_setup tests.test_harness_creator tests.test_harness_results tests.test_harness_delivery tests.test_harness_clash tests.test_harness_accelerators tests.test_desktop_app tests.test_harness_mentions tests.test_harness_updates tests.test_portable_fs tests.test_windows_security tests.test_windows_commands tests.test_windows_creator

  windows-harness:
    name: "Windows Harness (Python 3.13)"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Native Windows Harness acceptance and boundary tests
        shell: pwsh
        run: >-
          python -m unittest
          tests.test_harness_windows
          tests.test_harness_launcher
          tests.test_harness_process_runtime
          tests.test_portable_fs
          tests.test_windows_security
          tests.test_windows_commands
          tests.test_windows_creator
          tests.test_windows_discovery
          tests.test_ai_system_portable
          tests.test_desktop_app

  harness-fleet:
    name: Offline Fleet runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional graph runtime
        run: |
          python3 -m venv harness/.venv
          harness/.venv/bin/python -m pip install -e harness
      - name: Graph and checkpoint regression tests
        run: harness/.venv/bin/python -m unittest discover -s harness/tests -p 'test_*.py'
      - name: Browser Fleet integration without model calls
        run: python3 -m unittest tests.test_harness_fleet

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Bash syntax check (bash -n)
        # These launchers carry no .sh extension; include them in shell checks.
        run: git ls-files -z -- '*.sh' 'collect' 'kit3' 'harness-server' 'accelerator-app' | xargs -0 -r -n1 bash -n
      - name: ShellCheck (severity gate error)
        run: |
          shellcheck --version
          git ls-files -z -- '*.sh' 'collect' 'kit3' 'harness-server' 'accelerator-app' | xargs -0 -r shellcheck -S error
      - name: Validate JSON
        run: |
          git ls-files -z -- '*.json' | while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f" >&2; exit 1; }
          done
      - name: Cursor rule render carries no per-turn invalidator
        run: |
          # .cursor/rules/working-memory.mdc is alwaysApply: it is re-sent on
          # every prompt, so a clock or a per-call identifier inside it makes
          # each turn's prefix unique and is billed on a T^2/2 curve
          # (docs/TOKEN-ECONOMY-RESEARCH.md as of 9435dfc1^). The behavioural guard is
          # test_render_carries_no_per_turn_invalidator in each edition's
          # test_hooks.py; this is the cheap textual net in front of it.
          if git ls-files -z -- '*/.cursor/hooks/working-memory-write.sh' \
                                '*/.cursor/hooks/local-context.sh' \
            | xargs -0 -r grep -nE '\bdate[[:space:]]+[-+]|\$\(date|\$RANDOM|uuidgen'; then
            echo "Per-turn invalidator in the Cursor rule render (above)." >&2
            exit 1
          fi
      - name: PHP snippets are valid PHP
        # The repository tracks no .php files, but its skills and examples ship
        # hundreds of fenced PHP blocks, and those blocks are what an agent
        # copies when it writes code. --require-php makes a runner that loses
        # its preinstalled php fail rather than report a silent pass.
        run: python3 scripts/check_php_snippets.py --require-php
      - name: PHP snippet gate regression tests
        run: python3 -m unittest tests.test_check_php_snippets
      - name: Context budget
        run: python3 scripts/context_budget.py --check
      # Stdlib policy check, following the context-budget precedent above: the
      # stabilization rules declare their own template and nothing verified
      # that they obeyed it.
      - name: Stabilization rules are well-formed
        run: python3 scripts/check_stabilization.py
      - name: Stabilization validator regression tests
        run: python3 -m unittest tests.test_check_stabilization
      # Content identity for the surface the model reads. The other gates
      # measure its volume and its mirror agreement; none of them looks at
      # what it says, so an unreviewed instruction in an agent's prompt and a
      # mistyped `model:` value both passed silently.
      - name: Policy lock matches the surface
        run: python3 scripts/policy_lock.py --check
      - name: Policy lock regression tests
        run: python3 -m unittest tests.test_policy_lock
      # The routing eval itself invokes a model and stays out of CI, but its
      # scoring and its fixtures are ordinary code and are gated here.
      - name: Routing eval scoring and fixtures
        run: python3 -m unittest tests.test_routing_eval
      # Symfony's skill-creator adapts the upstream eval scripts to the Codex
      # and Cursor CLIs; its tests are excluded from installs and ran nowhere.
      - name: Symfony skill-creator adapter tests
        run: |
          (cd "Symfony/.agents/skills/skill-creator" && python3 -m unittest discover -s tests)
          (cd "Symfony/.cursor/skills/skill-creator" && python3 -m unittest discover -s tests)
      # scripts/check.py is the local twin of this workflow; the test fails
      # when a gate here has no entry there, or an entry there left CI.
      - name: check.py mirrors the workflows
        run: python3 -m unittest tests.test_check

  changelog:
    name: core-changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the merge base with the PR base branch;
          # a shallow checkout has no such history to resolve it from.
          fetch-depth: 0
      - name: Shared-core changes require a root CHANGELOG entry
        run: bash scripts/check_core_changelog.sh "origin/${{ github.base_ref }}"

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check relative markdown links
        run: python3 scripts/check_links.py
