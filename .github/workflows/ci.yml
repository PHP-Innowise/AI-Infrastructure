# Generated by infra-engine write-ci from install/check-catalog.json.
# Edit the catalog or native emitter; regenerate through the native command.
name: "Native repository checks"
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      legacy_oracles:
        description: Run retained verification references
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NATIVE_CHECK_GROUP: "changelog"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        id: native-toolchain
        with:
          components: rustfmt, clippy
      - name: Select the native target directory
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP//\\//}/infra-native-target" >> "$GITHUB_ENV"
      - name: Restore native Cargo artifacts
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_TARGET_DIR }}
          key: native-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.cachekey }}-changelog-dev0-${{ hashFiles('runtime-rust/Cargo.lock', 'runtime-rust/**/Cargo.toml', 'install/check-catalog.json', '.cargo/**', 'runtime-rust/.cargo/**') }}
          restore-keys: native-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.cachekey }}-changelog-dev0-
      - name: Build the native engine
        run: cargo build --manifest-path runtime-rust/Cargo.toml --locked --bin infra-engine
      - name: Run the catalog group
        run: |
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          engine="${RUNNER_TEMP//\\//}/infra-check-engine$suffix"
          cp "$CARGO_TARGET_DIR/debug/infra-engine$suffix" "$engine"
          "$engine" check --group "$NATIVE_CHECK_GROUP" --strict --base origin/main --log-dir "${RUNNER_TEMP//\\//}/infra-check-logs"
      - name: Keep the complete output of failed checks
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs-${{ github.job }}
          path: ${{ runner.temp }}/infra-check-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Save native Cargo artifacts
        if: ${{ !cancelled() && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
