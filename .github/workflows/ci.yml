# Generated by infra-engine write-ci from install/check-catalog.json.
# Edit the catalog or native emitter; regenerate through the native command.
name: "Native repository checks"
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      legacy_oracles:
        description: Run retained verification references
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARGO_TARGET_DIR: '${{ runner.temp }}/infra-native-target'
      NATIVE_CHECK_GROUP: "changelog"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build the native engine
        run: cargo build --manifest-path runtime-rust/Cargo.toml --locked --bin infra-engine
      - name: Run the catalog group
        run: |
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          "$CARGO_TARGET_DIR/debug/infra-engine$suffix" check --group "$NATIVE_CHECK_GROUP" --strict --base origin/main
