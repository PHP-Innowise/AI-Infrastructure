name: Git source probe (temporary)

# Temporary: loops the refresh that once failed on windows-latest with
# "Git source context unavailable", timing every Git process the runtime
# starts. Removed once the cause is known; never merged.
on:
  push:
    branches: [claude/dreamy-visvesvaraya-7aea6c]

jobs:
  loop:
    name: "probe ${{ matrix.shard }} (${{ matrix.mode }}, workers=${{ matrix.workers }}, trace2=${{ matrix.trace2 }})"
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 1, mode: fresh, workers: 1, trace2: false, minutes: 30}
          - {shard: 2, mode: fresh, workers: 1, trace2: false, minutes: 30}
          - {shard: 3, mode: fresh, workers: 1, trace2: false, minutes: 30}
          - {shard: 4, mode: fresh, workers: 1, trace2: true, minutes: 30}
          - {shard: 5, mode: fresh, workers: 1, trace2: true, minutes: 30}
          - {shard: 6, mode: fresh, workers: 3, trace2: false, minutes: 30}
          - {shard: 7, mode: unittest, workers: 1, trace2: false, minutes: 30}
          - {shard: 8, mode: fresh, workers: 6, trace2: false, minutes: 30}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Runner facts
        shell: pwsh
        run: |
          try { Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, BehaviorMonitorEnabled, OnAccessProtectionEnabled, IoavProtectionEnabled, AMRunningMode | Format-List | Out-String } catch { "Get-MpComputerStatus: $_" }
          try { Get-MpPreference | Select-Object DisableRealtimeMonitoring, ExclusionPath, ExclusionProcess | Format-List | Out-String } catch { "Get-MpPreference: $_" }
          Get-Command git -All | Select-Object Source | Format-Table -AutoSize | Out-String
          git version --build-options
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-String
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, TotalVisibleMemorySize, FreePhysicalMemory | Format-List | Out-String
          Get-Process | Select-Object Id, Name, CPU | ConvertTo-Json -Compress | Set-Content -Path "$env:RUNNER_TEMP\processes-before.json"
      - name: Loop the refresh
        shell: pwsh
        run: >-
          python .github/git-probe/loop.py --minutes ${{ matrix.minutes }} --workers ${{ matrix.workers }}
          --mode ${{ matrix.mode }} --out probe-out --shard ${{ matrix.shard }} ${{ matrix.trace2 && '--trace2' || '' }}
      - name: Processes by CPU used during the loop
        if: always()
        shell: pwsh
        run: |
          $before = @{}
          Get-Content "$env:RUNNER_TEMP\processes-before.json" | ConvertFrom-Json | ForEach-Object { $before["$($_.Id)"] = [double]$_.CPU }
          Get-Process | ForEach-Object {
            $was = if ($before.ContainsKey("$($_.Id)")) { $before["$($_.Id)"] } else { 0.0 }
            [pscustomobject]@{ Name = $_.Name; Id = $_.Id; CpuSeconds = [math]::Round([double]$_.CPU - $was, 1); New = -not $before.ContainsKey("$($_.Id)") }
          } | Sort-Object CpuSeconds -Descending | Select-Object -First 25 | Format-Table -AutoSize | Out-String -Width 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.shard }}
          path: probe-out
          retention-days: 7
