          retention-days: 14
  rust-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NATIVE_CHECK_GROUP: "wasm"
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
