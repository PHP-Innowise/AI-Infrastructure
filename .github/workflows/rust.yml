            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_TARGET_DIR }}
          key: native-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.cachekey }}-rust-wasm-dev0-${{ hashFiles('runtime-rust/Cargo.lock', 'runtime-rust/**/Cargo.toml', 'install/check-catalog.json', '.cargo/**', 'runtime-rust/.cargo/**') }}
      - name: Build the native engine
        run: cargo build --manifest-path runtime-rust/Cargo.toml --locked --bin infra-engine
      - name: Run the catalog group
        run: |
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          engine="${RUNNER_TEMP//\\//}/infra-check-engine$suffix"
          cp "$CARGO_TARGET_DIR/debug/infra-engine$suffix" "$engine"
          "$engine" check --group "$NATIVE_CHECK_GROUP" --strict --base origin/main --log-dir "${RUNNER_TEMP//\\//}/infra-check-logs"
