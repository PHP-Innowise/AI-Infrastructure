name: Native Windows Creator sandbox
on:
  workflow_dispatch:

permissions:
  contents: read

# Actual native Codex with elevated sandbox setup is required on this runner.
# Hosted Windows workspace tests do not establish this sandbox behavior.
jobs:
  creator:
    runs-on: [self-hosted, Windows, codex-sandbox]
    timeout-minutes: 25
    env:
      HARNESS_WINDOWS_CREATOR_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise native Creator and discovery sandbox boundaries
        shell: pwsh
        run: cargo test --manifest-path runtime-rust/Cargo.toml --locked -p infra-host --test windows_creator_sandbox -- --ignored --nocapture
