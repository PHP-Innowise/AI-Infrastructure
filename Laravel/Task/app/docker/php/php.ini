; PracticePerfect PHP settings, Laravel edition. Development-oriented.

memory_limit = 512M
max_execution_time = 60
date.timezone = UTC

; Uploads: trainer logos and content assets.
upload_max_filesize = 16M
post_max_size = 20M

expose_php = Off
error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.interned_strings_buffer = 16

; The active tenant lives in a PostgreSQL session variable, so a connection
; reused across requests would leak one tenant's variable into another's.
; No persistent PDO connections, and no connection pooler in front of
; PostgreSQL. See specs/architect-architecture.md, "Risks".
