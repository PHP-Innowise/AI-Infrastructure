; PracticePerfect PHP settings. Development-oriented; production overrides
; belong in a separate conf.d file layered on top of this image.

memory_limit = 512M
max_execution_time = 60
date.timezone = UTC

; Uploads: trainer logos and content assets.
upload_max_filesize = 16M
post_max_size = 20M

; Symfony recommends these regardless of environment.
expose_php = Off
error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.interned_strings_buffer = 16

; PDO must never hold a persistent connection: the tenancy model puts the
; active tenant in a PostgreSQL session variable, and a shared connection would
; leak one tenant's variable into another request.
; See specs/architect-architecture.md, "Risks". The application must never open
; the connection with PDO::ATTR_PERSISTENT, and no connection pooler may sit in
; front of PostgreSQL. The startup gate asserts the former.
