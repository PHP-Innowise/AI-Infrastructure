[www]
; Run workers as the host user so generated files stay editable outside the
; container. The master still starts as root so it can bind and chown.
user = ${APP_UID}
group = ${APP_GID}

listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Consumed by the container healthcheck.
ping.path = /ping
ping.response = pong
pm.status_path = /fpm-status

; Symfony reads configuration from the environment; php-fpm strips it by default.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
