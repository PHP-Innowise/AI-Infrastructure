server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /app/public;

    # Trainer logos can be SVG. They are always rendered through <img> and never
    # inlined, and this header stops a crafted SVG executing in our origin.
    # See specs/architect-architecture.md, "Risks".
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_read_timeout 60s;
        internal;
    }

    # Any other .php file is not a front controller and must not be executed.
    location ~ \.php$ {
        return 404;
    }

    location /uploads/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
    }

    error_log /dev/stderr warn;
    access_log /dev/stdout;
}
