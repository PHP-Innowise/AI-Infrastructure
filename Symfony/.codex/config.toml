# Symfony Layered Architecture Accelerator - project-scoped Codex configuration.
#
# Codex loads this file only when you TRUST the project
# (run `codex` in the repo and accept the trust prompt, or `/trust`).
# User-level settings in ~/.codex/config.toml still apply and take lower
# precedence than this file.

# The AGENTS.md chain Codex reads at session start stops at 32 KiB by
# default. A project's own AGENTS.md plus the accelerator's policy block,
# which comes last, passes that, and the policy was what got cut.
project_doc_max_bytes = 131072

# Enable lifecycle hooks defined in .codex/hooks.json.
# Hooks provide session context, shell-command safety, file naming, and loop detection.
[features]
hooks = true

# Codex ships built-in subagents (spawn_agent: default/worker/explorer
# roles). This project delegates through its own skills only, so
# multi-agent collaboration is off; both switches cover older and newer
# CLI versions, and the native subagent-gate hook backstops CLI/model
# combinations that ignore these flags.
multi_agent = false

[agents]
enabled = false

# Project memory is registered automatically; see memory-bank/MCP.md.
# BEGIN HARNESS MEMORY MCP
# Source template: installation writes the portable launch (a bound one on native Windows).
[mcp_servers.harness_memory]
command = "./memory-bank/bin/infra-engine"
args = ["mcp", "--root", ".", "--host", "codex"]
enabled = true
# END HARNESS MEMORY MCP
