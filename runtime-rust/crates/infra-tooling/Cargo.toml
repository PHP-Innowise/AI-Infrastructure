[package]
name = "infra-tooling"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
infra-core = { path = "../infra-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "=0.11.0"
regex = "1"
uuid = { version = "=1.22.0", features = ["v4"] }
libc = "=0.2.191"
sha1 = "=0.10.6"
toml_edit = "0.22"
ureq = { version = "=2.12.1", default-features = true }

[target.'cfg(windows)'.dependencies]
infra-host = { path = "../infra-host" }

