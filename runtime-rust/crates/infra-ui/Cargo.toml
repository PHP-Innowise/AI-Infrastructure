[package]
name = "infra-ui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dependencies.web-sys]
version = "0.3"
features = [
"Window","Document","Element","Node","NodeList","Event","EventTarget","KeyboardEvent",
"MouseEvent","PointerEvent","HtmlElement","HtmlInputElement","HtmlSelectElement",
"HtmlTextAreaElement","HtmlFormElement","HtmlDialogElement","HtmlDetailsElement",
"HtmlAnchorElement","HtmlCollection","DomTokenList","CssStyleDeclaration","DomRect",
"Request","RequestInit","RequestCredentials","RequestCache","RequestMode","Response",
"Headers","AbortController","AbortSignal","Storage","Location","History","MediaQueryList",
"File","FileList","FileReader","Blob","ProgressEvent","Navigator","Clipboard","Notification",
"NotificationOptions","NotificationPermission","Crypto","console"
]
