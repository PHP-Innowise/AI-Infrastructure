[package]
name = "infra-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
infra-host = { path = "../infra-host" }
infra-core = { path = "../infra-core" }
infra-tooling = { path = "../infra-tooling" }
infra-generator = { path = "../infra-generator" }
infra-system = { path = "../infra-system" }
infra-adapters = { path = "../infra-adapters" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "arbitrary_precision"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "modern_sqlite"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "io-util", "sync", "time"] }
axum = "=0.8.9"
uuid = { version = "=1.22.0", features = ["v4"] }
chrono = "=0.4.45"
sha2 = "=0.11.0"
sha1 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
base64 = "0.22"
libc = "=0.2.191"
regex = "1"
fancy-regex = "0.14"
tempfile = "3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
quick-xml = "=0.38.4"


