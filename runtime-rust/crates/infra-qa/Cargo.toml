[package]
name = "infra-qa"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
[dependencies]
anyhow = "1"
chrono = { version = "=0.4.45", features = ["serde"] }
glob = "0.3"
jsonschema = { version = "0.46", default-features = false }
regex = "1"
quick-xml = "0.38"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
tempfile = "3"
xmltree = "0.11"
zip = { version = "4", default-features = false, features = ["deflate"] }
