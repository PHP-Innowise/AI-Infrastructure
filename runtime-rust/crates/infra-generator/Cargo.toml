[package]
name = "infra-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
infra-core = { path = "../infra-core" }
infra-tooling = { path = "../infra-tooling" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "arbitrary_precision"] }
regex = "1"
uuid = { version = "=1.22.0", features = ["v4"] }
chrono = "=0.4.45"
fancy-regex = "0.14"

