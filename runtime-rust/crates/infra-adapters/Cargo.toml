[package]
name = "infra-adapters"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
infra-core = { path = "../infra-core" }
infra-host = { path = "../infra-host" }
infra-tooling = { path = "../infra-tooling" }
infra-generator = { path = "../infra-generator" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order","arbitrary_precision","raw_value"] }
chrono = "=0.4.45"
libc = "=0.2.191"
regex = "1"
toml = "0.8"
url = "2"
tempfile = "3"
