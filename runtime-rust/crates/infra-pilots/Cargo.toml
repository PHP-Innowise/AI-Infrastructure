[package]
name = "infra-pilots"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
[features]
default = ["onnx"]
onnx = ["dep:ort","dep:tokenizers","dep:libloading","dep:half"]
run-memory = ["dep:infra-system", "dep:infra-host", "dep:tokio"]
run-memory-redis = ["run-memory", "dep:redis"]
[dependencies]
anyhow = "1"
infra-core = { path = "../infra-core" }
infra-system = { path = "../infra-system", optional = true }
infra-host = { path = "../infra-host", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
redis = { version = "=1.7.1", default-features = false, optional = true }
fancy-regex = "0.14"
futures-util = "0.3"
chrono = "=0.4.45"
libc = "=0.2.191"
libloading = { version = "0.8", optional = true }
half = { version = "2.1", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std","load-dynamic","api-24","half"], optional = true }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
regex = "1"
rusqlite = { version = "=0.37.0", features = ["bundled","modern_sqlite","functions","load_extension"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
uuid = { version = "=1.22.0", features = ["v4", "serde"] }
url = "2.5"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Security","Win32_System_JobObjects","Win32_System_Threading"] }

[[example]]
name = "run_working_memory"
required-features = ["run-memory"]

[[example]]
name = "run_working_memory_live"
required-features = ["run-memory"]
